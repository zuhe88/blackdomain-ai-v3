<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>黑域 AI・動畫加速示範</title>
  <link rel="stylesheet" href="extension.css">
  <script src="speed.js" defer></script>
  <script src="panel.js" defer></script>
  <script src="demo.js" defer></script>
</head>
<body class="demo">
  <main>
    <h1>電子加速器示範</h1>
    <p>切換倍率觀察動畫，再用「恢復 1×」切回原速。免遊得分使用示範數據。</p>
    <div id="demo-layout">
      <div id="controls"></div>
      <section id="stage" aria-label="動畫測試區">
        <div class="track" data-blackdomain-presentation><div class="marker"></div></div>
        <button id="record" type="button">模擬一筆免遊結算</button>
      </section>
    </div>
  </main>
</body>
</html>
