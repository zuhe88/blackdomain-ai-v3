<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>黑域AI｜網站會員管理</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080d16;color:#f5f1e7;font-family:system-ui,sans-serif;padding:28px 20px}main{max-width:540px;margin:auto;padding:26px;background:#111823;border:1px solid #756029;border-radius:20px}h1{font-size:25px}p{color:#bac2ce;line-height:1.7}label{display:block;margin:20px 0 8px}input,select,button{width:100%;min-height:48px;padding:12px;border-radius:10px;border:1px solid #536073;background:#080d16;color:white;font:inherit}button{margin-top:24px;background:#dfbd69;color:#171207;font-weight:800;cursor:pointer}button:disabled{opacity:.6}a{color:#dfbd69}#message{min-height:24px}</style></head><body><main><h1>網站會員管理</h1><p>開通無需 LINE 的網站會員。輸入相同帳號可更新期限、停用或重設密碼；不影響既有 LINE 會員。</p><form id="member"><label for="account">OFA 帳號</label><input id="account" autocomplete="off" pattern="[A-Za-z0-9]+" maxlength="64" required><label for="password">AI 專用密碼</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128"><p>新增須設定 12 至 128 字元密碼；更新時留空可保留密碼。請將帳號、密碼及網站登入網址交給會員。</p><label for="expiresAt">有效期限（依本機時區）</label><input id="expiresAt" type="datetime-local" required><label for="enabled">使用狀態</label><select id="enabled"><option value="true">開通</option><option value="false">停用</option></select><button id="submit">儲存網站會員</button><p id="message" role="status" aria-live="polite"></p></form><p>會員登入網址：<a href="/portal/member-login">開啟網站會員登入</a></p><a href="/portal/">返回分析中心</a></main>
<script>document.getElementById("member").addEventListener("submit",async event=>{event.preventDefault();const button=document.getElementById("submit"),message=document.getElementById("message");button.disabled=true;message.textContent="正在儲存…";try{const response=await fetch("/api/web/admin/web-members",{method:"POST",headers:{"content-type":"application/json","x-blackdomain-portal":"1"},body:JSON.stringify({account:document.getElementById("account").value,password:document.getElementById("password").value,expiresAt:new Date(document.getElementById("expiresAt").value).toISOString(),enabled:document.getElementById("enabled").value==="true"})});const value=await response.json();if(!response.ok)throw new Error(value.error||"儲存失敗。");document.getElementById("password").value="";message.textContent="已儲存。此帳號原有登入已失效，會員請重新登入。"}catch(error){message.textContent=error.message||"連線失敗。"}finally{button.disabled=false}});</script></body></html>
