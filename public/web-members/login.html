<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>黑域AI｜網站會員登入</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#28251b,#080d16 65%);color:#f5f1e7;font-family:system-ui,sans-serif}main{width:min(100%,420px);padding:32px 26px;border:1px solid #756029;border-radius:24px;background:#10151e;box-shadow:0 20px 70px #0008}img{width:64px;height:64px}h1{font-size:26px;margin:18px 0 10px}p{color:#b9bec8;line-height:1.7}label{display:block;margin:18px 0 8px;font-weight:600;font-size:14px}input,button{width:100%;min-height:48px;border-radius:12px;font:inherit}input{padding:12px;border:1px solid #536073;background:#080d16;color:white}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #dfbd69;outline-offset:3px}button{margin-top:24px;border:0;background:#dfbd69;color:#171207;font-weight:800;cursor:pointer}button:disabled{opacity:.6}a{color:#dfbd69}small{display:block;color:#a5adba;line-height:1.7}#message{min-height:24px;color:#ffb6aa;font-size:14px}</style></head>
<body><main><img src="/brand/blackdomain-ai-logo.png" alt="黑域AI"><h1>網站會員登入</h1><p>無需 LINE，使用管理員開通的<br>3A 帳號與 AI 專用密碼登入。</p>
<form id="login"><label for="account">3A 帳號</label><input id="account" name="account" autocomplete="username" maxlength="64" pattern="[A-Za-z0-9]+" required><label for="password">AI 專用密碼</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><button id="submit" type="submit">登入黑域AI</button><p id="message" role="status" aria-live="polite"></p></form>
<small>尚未開通或忘記密碼，請聯絡提供服務的管理員。<br>請使用另外設定的 AI 專用密碼。</small><p><a href="/portal/">返回首頁／LINE 會員登入</a></p></main>
<script>document.getElementById("login").addEventListener("submit",async event=>{event.preventDefault();const button=document.getElementById("submit"),message=document.getElementById("message");button.disabled=true;message.textContent="正在登入…";try{const response=await fetch("/api/web/member/login",{method:"POST",headers:{"content-type":"application/json","x-blackdomain-portal":"1"},body:JSON.stringify({account:document.getElementById("account").value,password:document.getElementById("password").value})});const value=await response.json();if(!response.ok)throw new Error(value.error||"登入失敗，請稍後再試。");document.getElementById("password").value="";location.replace("/portal/")}catch(error){message.textContent=error.message||"連線失敗，請稍後再試。";button.disabled=false}});</script></body></html>
