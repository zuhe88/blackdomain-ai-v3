<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050504"><title>黑域AI｜即時分析中心</title>
<style>
[hidden]{display:none!important}
:root{--bg:#050504;--panel:#11110f;--panel2:#181713;--gold:#e3bd3f;--gold2:#8e6f19;--ink:#fff;--muted:#aaa69a;--green:#32e6a1;--red:#e25b60;--line:rgba(227,189,63,.26)}*{box-sizing:border-box}html{background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,rgba(227,189,63,.15),transparent 38%),linear-gradient(135deg,transparent 49.7%,rgba(227,189,63,.025) 50%,transparent 50.3%);background-size:auto,34px 34px}.shell{width:min(1060px,100%);margin:auto;padding:20px 16px 96px}.top{position:sticky;top:0;z-index:4;margin:-20px -16px 18px;padding:16px max(16px,calc((100vw - 1060px)/2));display:flex;align-items:center;justify-content:space-between;background:rgba(5,5,4,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{display:flex;gap:11px;align-items:center}.mark{width:42px;height:42px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-weight:900;box-shadow:0 0 30px rgba(227,189,63,.18)}.brand b{display:block;font-size:16px}.brand small,.status{color:var(--muted);font-size:12px}.live{display:flex;align-items:center;gap:7px;color:var(--green);font-size:12px}.live:before{content:"";width:7px;height:7px;background:currentColor;border-radius:50%;box-shadow:0 0 12px currentColor}.hero{padding:30px 2px 24px}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.14em}.hero h1{font-size:clamp(29px,7vw,54px);line-height:1.05;margin:10px 0}.hero p{color:var(--muted);line-height:1.75;max-width:650px}.games{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:10px 0 26px}.game{min-height:94px;padding:14px 10px;border-radius:17px;border:1px solid var(--line);background:linear-gradient(145deg,var(--panel2),#0b0b09);color:var(--ink);text-align:left;cursor:pointer;transition:.18s}.game:hover{transform:translateY(-2px);border-color:var(--gold)}.game i{display:block;font-style:normal;font-size:25px;margin-bottom:9px}.game b{font-size:14px}.game small{display:block;color:var(--muted);margin-top:4px}.feed{display:flex;flex-direction:column;gap:14px}.empty{padding:46px 20px;border:1px dashed var(--line);border-radius:22px;text-align:center;color:var(--muted)}.message{border:1px solid var(--line);border-radius:23px;background:linear-gradient(150deg,rgba(24,23,19,.98),rgba(9,9,8,.98));overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.25)}.message-head{padding:18px 20px;border-bottom:1px solid var(--line);color:var(--gold);font-weight:800;letter-spacing:.04em}.message-body{padding:18px 20px}.texts{white-space:pre-wrap;line-height:1.7}.texts .big{font-size:24px;font-weight:900;color:#fff}.texts .muted{color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;padding:0 20px 20px}.action{border:1px solid var(--gold2);background:#18150b;color:#fff;border-radius:13px;padding:12px 10px;font-weight:700;cursor:pointer}.action.primary{background:linear-gradient(135deg,#d4ad34,#9a7418);color:#090806}.composer{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:11px max(14px,calc((100vw - 1060px)/2));display:flex;gap:9px;background:rgba(8,8,7,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;background:#151411;color:#fff;padding:13px 15px;font-size:16px}.composer button{border:0;border-radius:14px;padding:0 20px;background:var(--gold);font-weight:900}.loading{opacity:.55;pointer-events:none}.login{max-width:500px;margin:18vh auto;text-align:center;padding:34px;border:1px solid var(--line);border-radius:28px;background:var(--panel)}.login h1{color:var(--gold)}@media(max-width:760px){.games{grid-template-columns:repeat(2,1fr)}.game:last-child{grid-column:span 2}.hero{padding-top:16px}.message{border-radius:18px}}@media(min-width:761px){.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.message:first-child{grid-column:1/-1}}
</style></head><body><main class="shell" id="app"><header class="top"><div class="brand"><div class="mark">AI</div><div><b>黑域AI</b><small>BLACKDOMAIN CONTROL CENTER</small></div></div><div class="live" id="live">連線中</div></header><section class="hero"><div class="eyebrow">REAL-TIME INTELLIGENCE</div><h1>你的第二個<br>AI 分析中心</h1><p>所有推薦、即時房況與自動下一局都會直接更新在這裡。網站開啟期間不使用 LINE 推播額度。</p></section><nav class="games"><button class="game" data-cmd="百家樂"><i>♠</i><b>百家樂 AI</b><small>DG・MT</small></button><button class="game" data-cmd="電子"><i>⚡</i><b>電子 AI</b><small>賽特與房況</small></button><button class="game" data-cmd="彩票"><i>◉</i><b>彩票 AI</b><small>MB・539・賽馬</small></button><button class="game" data-cmd="體育"><i>◆</i><b>體育 AI</b><small>CPBL・MLB・NBA</small></button><button class="game" data-cmd="VIP"><i>♛</i><b>會員中心</b><small>權限與管理</small></button></nav><section class="feed" id="feed"><div class="empty">選擇上方功能開始分析<br><small>即時結果會自動出現在此處</small></div></section></main><form class="composer" id="composer"><input id="command" autocomplete="off" placeholder="輸入功能或操作指令"><button>送出</button></form>
<script>
const feed=document.querySelector('#feed'),composer=document.querySelector('#composer'),input=document.querySelector('#command'),live=document.querySelector('#live');
function walk(node,out={texts:[],actions:[],images:[]}){if(!node)return out;if(Array.isArray(node)){node.forEach(v=>walk(v,out));return out}if(typeof node!=='object')return out;if(node.type==='text'&&node.text)out.texts.push(node.text);if(node.type==='image'&&node.url)out.images.push(node.url);if(node.action){const a=node.action;if(a.type==='message')out.actions.push({label:a.label||a.text,text:a.text});if(a.type==='uri')out.actions.push({label:a.label||'開啟連結',uri:a.uri})}for(const key of ['contents','body','hero','footer'])walk(node[key],out);return out}
function render(messages,prepend=true){const list=Array.isArray(messages)?messages:[messages];const frag=document.createDocumentFragment();list.forEach(m=>{const card=document.createElement('article');card.className='message';let data;if(m.type==='text')data={texts:[m.text],actions:(m.quickReply?.items||[]).map(i=>({label:i.action?.label,text:i.action?.text})),images:[]};else data=walk(m.contents);const uniq=[...new Set(data.texts.map(String).filter(Boolean))];const actions=[...new Map(data.actions.filter(a=>a.text||a.uri).map(a=>[a.text||a.uri,a])).values()];const title=uniq.shift()||m.altText||'黑域AI';const hero=data.images[0]?`<img src="${escape(data.images[0])}" alt="" style="display:block;width:100%;max-height:230px;object-fit:cover;border-bottom:1px solid var(--line)">`:'';card.innerHTML=`${hero}<div class="message-head">${escape(title)}</div><div class="message-body"><div class="texts">${uniq.map((t,i)=>`<div class="${i===0&&t.length<22?'big':'muted'}">${escape(t)}</div>`).join('')}</div></div>`;if(actions.length){const box=document.createElement('div');box.className='actions';actions.forEach((a,i)=>{const b=document.createElement('button');b.className='action '+(i===0?'primary':'');b.textContent=a.label||a.text;if(a.uri)b.onclick=()=>location.href=a.uri;else b.onclick=()=>send(a.text);box.append(b)});card.append(box)}frag.append(card)});if(feed.querySelector('.empty'))feed.innerHTML='';if(prepend)feed.prepend(frag);else feed.append(frag)}
function escape(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
async function send(text){if(!text)return;document.body.classList.add('loading');try{const r=await fetch('/api/web/command',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});if(r.status===401)return showLogin();const data=await r.json();if(data.messages)render(data.messages)}catch{render({type:'text',text:'目前無法連線，系統會自動重試。'})}finally{document.body.classList.remove('loading');input.value=''}}
function showLogin(){document.querySelector('#app').innerHTML='<section class="login"><div class="mark" style="margin:auto">AI</div><h1>請先登入網站</h1><p>請在黑域AI LINE輸入「網站登入」，點擊10分鐘有效連結。登入後可維持30天。</p></section>';composer.hidden=true}
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>send(b.dataset.cmd));composer.onsubmit=e=>{e.preventDefault();send(input.value.trim())};
fetch('/api/web/me').then(r=>r.json()).then(v=>{if(!v.authenticated)return showLogin();(v.messages||[]).forEach(x=>render(x.messages,false));const es=new EventSource('/api/web/events');es.addEventListener('ready',()=>live.textContent='即時連線');es.addEventListener('message',e=>render(JSON.parse(e.data)));es.onerror=()=>live.textContent='重新連線中'}).catch(showLogin);
</script></body></html>
