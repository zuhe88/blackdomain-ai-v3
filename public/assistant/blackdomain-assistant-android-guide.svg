<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070c"/><stop offset=".55" stop-color="#101322"/><stop offset="1" stop-color="#07141b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#775ce7"/><stop offset="1" stop-color="#31bfd1"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151a27"/><stop offset="1" stop-color="#0a0e17"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".42"/></filter>
    <filter id="logoGlow"><feDropShadow dx="0" dy="0" stdDeviation="13" flood-color="#d7aa45" flood-opacity=".45"/></filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#72b4da" stroke-opacity=".045"/></pattern>
    <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}.eyebrow{font-size:22px;font-weight:900;letter-spacing:6px;fill:#63dce9}.title{font-size:58px;font-weight:950;fill:#fff}.subtitle{font-size:27px;fill:#aab6c8}.step{font-size:22px;font-weight:900;letter-spacing:3px;fill:#63dce9}.head{font-size:34px;font-weight:950;fill:#fff}.body{font-size:25px;fill:#bdc6d5}.strong{font-size:25px;font-weight:900;fill:#fff}.num{font-size:34px;font-weight:950;fill:#fff}.warn{font-size:28px;font-weight:950;fill:#ffd26c}.warnBody{font-size:24px;fill:#e7d5a7}.footer{font-size:21px;fill:#8e9bad}</style>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/><rect width="1080" height="1920" fill="url(#grid)"/><circle cx="935" cy="65" r="330" fill="#7255d8" opacity=".08"/><circle cx="110" cy="1750" r="370" fill="#24aabe" opacity=".06"/>
  <image x="70" y="60" width="170" height="170" href="../brand/blackdomain-ai-logo.png" xlink:href="../brand/blackdomain-ai-logo.png" filter="url(#logoGlow)"/>
  <text x="275" y="102" class="eyebrow">BLACKDOMAIN MOBILE</text><text x="275" y="170" class="title">黑域 AI 安卓助手</text><text x="275" y="215" class="subtitle">設定一次，遊戲中隨時叫出</text><rect x="70" y="266" width="940" height="5" rx="3" fill="url(#accent)"/>
  <g transform="translate(70 320)" filter="url(#shadow)"><rect width="940" height="225" rx="28" fill="url(#card)" stroke="#6656c8" stroke-opacity=".62"/><circle cx="66" cy="66" r="35" fill="#7059df"/><text x="66" y="78" text-anchor="middle" class="num">1</text><text x="125" y="60" class="step">開啟安裝頁</text><text x="125" y="112" class="head">使用 Android Chrome</text><text x="125" y="163" class="body">開啟助手安裝頁，按「複製書籤程式」</text><rect x="125" y="186" width="430" height="4" rx="2" fill="#3fc6d6" opacity=".7"/></g>
  <g transform="translate(70 585)" filter="url(#shadow)"><rect width="940" height="260" rx="28" fill="url(#card)" stroke="#338fa3" stroke-opacity=".62"/><circle cx="66" cy="66" r="35" fill="#299aae"/><text x="66" y="78" text-anchor="middle" class="num">2</text><text x="125" y="60" class="step">建立助手書籤</text><text x="125" y="112" class="head">右上角 ⋮ → 加入書籤</text><text x="125" y="163" class="body">編輯書籤，名稱改成</text><text x="420" y="163" class="strong">「黑域 AI 助手」</text><text x="125" y="211" class="body">網址全部刪除，再貼上剛複製的程式</text></g>
  <g transform="translate(70 885)" filter="url(#shadow)"><rect width="940" height="225" rx="28" fill="url(#card)" stroke="#6656c8" stroke-opacity=".62"/><circle cx="66" cy="66" r="35" fill="#7059df"/><text x="66" y="78" text-anchor="middle" class="num">3</text><text x="125" y="60" class="step">進入 3A</text><text x="125" y="112" class="head">點 Chrome 網址列</text><text x="125" y="163" class="body">輸入「黑域 AI 助手」搜尋書籤</text></g>
  <g transform="translate(70 1150)" filter="url(#shadow)"><rect width="940" height="225" rx="28" fill="url(#card)" stroke="#338fa3" stroke-opacity=".62"/><circle cx="66" cy="66" r="35" fill="#299aae"/><text x="66" y="78" text-anchor="middle" class="num">4</text><text x="125" y="60" class="step">叫出助手</text><text x="125" y="112" class="head">點選帶有 ★ 的書籤建議</text><text x="125" y="163" class="body">右側出現黑域 AI Logo，點 Logo 開始分析</text></g>
  <g transform="translate(70 1415)" filter="url(#shadow)"><rect width="940" height="260" rx="28" fill="#1c170e" stroke="#d4a43e" stroke-opacity=".7"/><circle cx="66" cy="68" r="35" fill="#d1a13b" fill-opacity=".17" stroke="#dcb04d"/><text x="66" y="80" text-anchor="middle" class="warn">!</text><text x="125" y="77" class="warn">一定要注意</text><text x="125" y="134" class="warnBody">不要使用 LINE 內建瀏覽器</text><text x="125" y="180" class="warnBody">不要從 Chrome「書籤清單」直接點開</text><text x="125" y="226" class="warnBody">Logo 消失時，再從 3A 網址列搜尋一次</text></g>
  <rect x="70" y="1720" width="940" height="105" rx="25" fill="#091416" stroke="#348f89" stroke-opacity=".6"/><text x="540" y="1763" text-anchor="middle" class="step">助手安裝頁</text><text x="540" y="1803" text-anchor="middle" class="body">blackdomain-ai-v3-production.up.railway.app/assistant/</text><text x="540" y="1872" text-anchor="middle" class="footer">首次使用輸入已開通的 3A 帳號即可</text>
</svg>
