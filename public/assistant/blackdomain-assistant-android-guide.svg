<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07080d"/><stop offset=".55" stop-color="#11101d"/><stop offset="1" stop-color="#07141b"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171b28"/><stop offset="1" stop-color="#0b0e16"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#765fe5"/><stop offset="1" stop-color="#2fbad0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#6aa8cf" stroke-opacity=".055"/></pattern>
    <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}.k{font-size:22px;font-weight:800;letter-spacing:6px;fill:#61dfed}.t{font-size:60px;font-weight:900;fill:#f7f8fc}.l{font-size:25px;fill:#9ca7ba}.s{font-size:20px;font-weight:900;letter-spacing:3px;fill:#6ee5f1}.h{font-size:31px;font-weight:900;fill:#f7f8fc}.b{font-size:22px;fill:#acb5c5}.m{font-size:18px;fill:#7f8a9e}.n{font-size:31px;font-weight:900;fill:#fff}.c{font-size:19px;font-weight:800;fill:#d7d2ff}.warn{font-size:24px;font-weight:900;fill:#ffd474}.warnb{font-size:21px;fill:#d6c9a5}</style>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/><rect width="1080" height="1920" fill="url(#grid)"/><circle cx="890" cy="135" r="300" fill="#6749df" opacity=".09"/><circle cx="110" cy="1710" r="330" fill="#27bdd0" opacity=".06"/>
  <circle cx="136" cy="124" r="57" fill="#090b11" stroke="#ef4058" stroke-width="3"/><circle cx="136" cy="124" r="45" fill="none" stroke="#765fe5" stroke-opacity=".7"/><path d="M108 111h17l11-18 11 18h17l-13 14 6 20-21-12-21 12 6-20z" fill="none" stroke="#ef5265" stroke-width="4" stroke-linejoin="round"/><text x="136" y="160" text-anchor="middle" font-size="14" font-weight="900" fill="#f4f5fa">AI</text>
  <text x="220" y="98" class="k">BLACKDOMAIN MOBILE</text><text x="220" y="158" class="t">黑域 AI 安卓助手</text><text x="78" y="225" class="l">Chrome 設定一次・不用下載 App・遊戲中隨時叫出</text><rect x="78" y="263" width="924" height="5" rx="3" fill="url(#accent)" filter="url(#glow)"/>
  <g transform="translate(78 315)"><rect width="444" height="252" rx="28" fill="url(#panel)" stroke="#685bd0" stroke-opacity=".48"/><circle cx="54" cy="52" r="27" fill="#6d5ddd"/><text x="54" y="63" class="n" text-anchor="middle">1</text><text x="98" y="48" class="s">首次設定</text><text x="34" y="105" class="h">開啟安裝頁</text><text x="34" y="150" class="b">使用 Android Chrome 開啟</text><text x="34" y="185" class="b">助手安裝頁並複製程式</text><rect x="34" y="207" width="268" height="28" rx="14" fill="#765fe5" fill-opacity=".16"/><text x="50" y="227" class="c">請使用最新版 Chrome</text></g>
  <g transform="translate(558 315)"><rect width="444" height="252" rx="28" fill="url(#panel)" stroke="#3eabc2" stroke-opacity=".44"/><circle cx="54" cy="52" r="27" fill="#278fa7"/><text x="54" y="63" class="n" text-anchor="middle">2</text><text x="98" y="48" class="s">建立書籤</text><text x="34" y="105" class="h">加入 Chrome 書籤</text><text x="34" y="150" class="b">按右上角 ⋮ 選擇「☆」</text><text x="34" y="185" class="b">把安裝頁加進書籤</text><text x="34" y="225" class="m">書籤名稱可先保留原本名稱</text></g>
  <g transform="translate(78 603)"><rect width="924" height="252" rx="28" fill="url(#panel)" stroke="#52687f" stroke-opacity=".55"/><circle cx="58" cy="56" r="27" fill="#41617c"/><text x="58" y="67" class="n" text-anchor="middle">3</text><text x="104" y="52" class="s">貼上程式</text><text x="34" y="115" class="h">編輯剛建立的書籤</text><text x="34" y="160" class="b">名稱改為「黑域 AI 助手」，網址全部刪除後貼上程式</text><rect x="34" y="188" width="856" height="38" rx="14" fill="#080b12" stroke="#30465a"/><text x="56" y="214" class="c">請確認網址開頭是 javascript:</text></g>
  <g transform="translate(78 891)"><rect width="924" height="218" rx="28" fill="url(#panel)" stroke="#685bd0" stroke-opacity=".48"/><circle cx="58" cy="56" r="27" fill="#6d5ddd"/><text x="58" y="67" class="n" text-anchor="middle">4</text><text x="104" y="52" class="s">開始使用</text><text x="34" y="115" class="h">進入 3A，再點「黑域 AI 助手」書籤</text><rect x="34" y="143" width="856" height="48" rx="15" fill="#080b12" stroke="#30465a"/><circle cx="63" cy="167" r="7" fill="#4be2a2" filter="url(#glow)"/><text x="88" y="175" class="b">畫面右側會出現可拖曳的黑域 AI 圓形圖示</text></g>
  <g transform="translate(78 1145)"><rect width="444" height="278" rx="28" fill="url(#panel)" stroke="#3eabc2" stroke-opacity=".44"/><circle cx="54" cy="52" r="27" fill="#278fa7"/><text x="54" y="63" class="n" text-anchor="middle">5</text><text x="98" y="48" class="s">首次驗證</text><text x="34" y="105" class="h">輸入已開通的</text><text x="34" y="141" class="h">3A 帳號</text><text x="34" y="190" class="b">驗證通過後直接登入</text><text x="34" y="228" class="m">之後重新叫出不必再登入</text></g>
  <g transform="translate(558 1145)"><rect width="444" height="278" rx="28" fill="url(#panel)" stroke="#685bd0" stroke-opacity=".48"/><circle cx="54" cy="52" r="27" fill="#6d5ddd"/><text x="54" y="63" class="n" text-anchor="middle">6</text><text x="98" y="48" class="s">開始分析</text><text x="34" y="105" class="h">點選懸浮 Logo</text><text x="34" y="150" class="b">選擇遊戲類型後</text><text x="34" y="185" class="b">直接進入分析流程</text><rect x="34" y="215" width="376" height="42" rx="14" fill="url(#accent)" opacity=".88"/><text x="222" y="243" class="c" text-anchor="middle">可拖曳到順手的位置</text></g>
  <g transform="translate(78 1466)"><rect width="924" height="200" rx="30" fill="#1b1711" stroke="#d5a944" stroke-opacity=".48"/><circle cx="62" cy="62" r="29" fill="#d0a13d" fill-opacity=".18" stroke="#d9ad4c"/><text x="62" y="71" class="warn" text-anchor="middle">!</text><text x="112" y="69" class="warn">使用時請注意</text><text x="38" y="121" class="warnb">遊戲切換或整頁重新整理後，助手圖示會消失。</text><text x="38" y="158" class="warnb">再點一次書籤即可恢復，不需重新輸入 3A 帳號。</text></g>
  <rect x="78" y="1710" width="924" height="86" rx="24" fill="#0b1517" stroke="#3a9b91" stroke-opacity=".45"/><text x="540" y="1746" class="s" text-anchor="middle">助手安裝頁</text><text x="540" y="1778" class="b" text-anchor="middle">blackdomain-ai-v3-production.up.railway.app/assistant/</text><text x="540" y="1850" class="m" text-anchor="middle">分析資訊僅供娛樂參考，請理性使用。</text>
</svg>
