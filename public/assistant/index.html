  <title>黑域 AI｜一鍵懸浮助手</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:calc(24px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 0,#281016,#090b10 42%,#050609);color:#f7f8fb;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{width:min(100%,560px);margin:auto}.brand{display:flex;align-items:center;gap:13px;margin-bottom:28px}.brand img{width:58px;height:58px;border-radius:50%;box-shadow:0 0 28px #8d1c2d}.brand small{display:block;color:#ff6576;letter-spacing:.14em;font-size:10px}.brand b{display:block;margin-top:4px;font-size:20px}h1{margin:0;font-size:30px;line-height:1.2}.lead{margin:12px 0 24px;color:#aeb3be;line-height:1.7}.card{padding:20px;border:1px solid #3b3036;border-radius:20px;background:rgba(12,14,20,.92);box-shadow:0 24px 70px #000}.card h2{margin:0 0 14px;font-size:18px}.code{width:100%;height:86px;padding:12px;border:1px solid #343944;border-radius:12px;background:#07090d;color:#aeb5c2;resize:none;font-size:11px}.copy{width:100%;height:50px;margin-top:12px;border:0;border-radius:13px;background:linear-gradient(135deg,#ff5368,#b9142e);color:white;font-size:15px;font-weight:900}.status{min-height:20px;margin:9px 0 0;color:#6ff0bd;font-size:12px}.steps{margin-top:18px;padding:20px;border:1px solid #272c35;border-radius:18px;background:#090c12}.steps h2{margin:0 0 12px;font-size:17px}.steps ol{margin:0;padding-left:22px;color:#c3c7d0;line-height:1.9}.note{margin-top:18px;color:#727986;font-size:11px;line-height:1.65}.launch{display:block;margin-top:16px;padding:15px;border:1px solid #4a2730;border-radius:13px;color:#fff;text-align:center;text-decoration:none;font-weight:800}
  </style>
</head>
<body><main class="wrap"><div class="brand"><img src="/brand/blackdomain-ai-logo.png" alt="黑域 AI"><div><small>BLACKDOMAIN MOBILE TOOL</small><b>黑域 AI 懸浮助手</b></div></div><h1>一鍵放進遊戲頁面</h1><p class="lead">不需 Expo Go。首次建立書籤後，在 3A 首頁或進入遊戲後點一下，都能顯示可拖曳的黑域 AI Logo。</p><section class="card"><h2>複製助手書籤程式</h2><textarea id="code" class="code" readonly></textarea><button id="copy" class="copy" type="button">複製書籤程式</button><p id="status" class="status"></p></section><section class="steps"><h2>iPhone Safari 設定</h2><ol><li>先將本頁加入書籤。</li><li>進入 Safari 書籤並編輯剛建立的書籤。</li><li>名稱改為「黑域 AI 助手」，網址全部刪除後貼上剛複製的程式。</li><li>開啟 3A 或遊戲頁，再從書籤點「黑域 AI 助手」。</li></ol><a class="launch" href="https://sn058.3a1788.bet/" rel="noopener noreferrer">前往 3A 測試</a></section><p class="note">遊戲切換或整頁重新整理後，再點一次書籤即可恢復助手；會員登入狀態會保留。</p></main><script>let device=localStorage.getItem("blackdomain_assistant_device");if(!device){const bytes=crypto.getRandomValues(new Uint8Array(24));device=Array.from(bytes,value=>value.toString(16).padStart(2,"0")).join("");localStorage.setItem("blackdomain_assistant_device",device)}const loader=`https://blackdomain-ai-v3-production.up.railway.app/assistant/bookmarklet.js?v=20260907.03&device=${encodeURIComponent(device)}`;const code=`javascript:(()=>{if(document.getElementById('blackdomain-floating-assistant')){document.getElementById('blackdomain-floating-assistant').remove();return}const s=document.createElement('script');s.src='${loader}&t='+Date.now();document.documentElement.appendChild(s)})()`;document.getElementById("code").value=code;document.getElementById("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(code);document.getElementById("status").textContent="已複製，請貼到書籤的網址欄位。"}catch{document.getElementById("code").select();document.execCommand("copy");document.getElementById("status").textContent="已複製。"}});</script></body>
</html>
