<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07080d"/><stop offset=".5" stop-color="#11101d"/><stop offset="1" stop-color="#07141b"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171b28"/><stop offset="1" stop-color="#0b0e16"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#765fe5"/><stop offset="1" stop-color="#2fbad0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#6aa8cf" stroke-opacity=".055"/></pattern>
    <style>
      text{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}.kicker{font-size:22px;font-weight:800;letter-spacing:6px;fill:#61dfed}.title{font-size:62px;font-weight:900;fill:#f7f8fc}.lead{font-size:25px;fill:#9ca7ba}.step{font-size:20px;font-weight:900;letter-spacing:3px;fill:#6ee5f1}.heading{font-size:31px;font-weight:900;fill:#f7f8fc}.body{font-size:22px;fill:#acb5c5}.mini{font-size:18px;fill:#7f8a9e}.num{font-size:31px;font-weight:900;fill:white}.chip{font-size:19px;font-weight:800;fill:#d7d2ff}.noteTitle{font-size:25px;font-weight:900;fill:#ffd474}.noteBody{font-size:21px;fill:#d6c9a5}
    </style>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/><rect width="1080" height="1920" fill="url(#grid)"/>
  <circle cx="890" cy="135" r="300" fill="#6749df" opacity=".09"/><circle cx="110" cy="1710" r="330" fill="#27bdd0" opacity=".06"/>

  <circle cx="136" cy="124" r="57" fill="#090b11" stroke="#ef4058" stroke-width="3"/>
  <circle cx="136" cy="124" r="45" fill="none" stroke="#765fe5" stroke-opacity=".7"/>
  <path d="M108 111h17l11-18 11 18h17l-13 14 6 20-21-12-21 12 6-20z" fill="none" stroke="#ef5265" stroke-width="4" stroke-linejoin="round"/>
  <text x="136" y="160" text-anchor="middle" font-size="14" font-weight="900" fill="#f4f5fa">AI</text>
  <text x="220" y="98" class="kicker">BLACKDOMAIN MOBILE</text>
  <text x="220" y="158" class="title">黑域 AI 手機助手</text>
  <text x="78" y="225" class="lead">不用下載 App・首次設定一次・遊戲中隨時叫出</text>
  <rect x="78" y="263" width="924" height="5" rx="3" fill="url(#accent)" filter="url(#glow)"/>

  <g transform="translate(78 315)">
    <rect width="444" height="252" rx="28" fill="url(#panel)" stroke="#685bd0" stroke-opacity=".48"/>
    <circle cx="54" cy="52" r="27" fill="#6d5ddd"/><text x="54" y="63" class="num" text-anchor="middle">1</text>
    <text x="98" y="48" class="step">首次設定</text><text x="34" y="105" class="heading">更新助手書籤</text>
    <text x="34" y="150" class="body">開啟助手安裝頁，按下</text><text x="34" y="185" class="body">「複製書籤程式」</text>
    <rect x="34" y="207" width="272" height="28" rx="14" fill="#765fe5" fill-opacity=".16"/><text x="50" y="227" class="chip">只需更新設定一次</text>
  </g>
  <g transform="translate(558 315)">
    <rect width="444" height="252" rx="28" fill="url(#panel)" stroke="#3eabc2" stroke-opacity=".44"/>
    <circle cx="54" cy="52" r="27" fill="#278fa7"/><text x="54" y="63" class="num" text-anchor="middle">2</text>
    <text x="98" y="48" class="step">貼上程式</text><text x="34" y="105" class="heading">編輯原本書籤</text>
    <text x="34" y="150" class="body">名稱保留「黑域 AI 助手」</text><text x="34" y="185" class="body">網址全部刪除，再貼上新版程式</text>
    <text x="34" y="225" class="mini">請確認開頭是 javascript:</text>
  </g>

  <g transform="translate(78 603)">
    <rect width="924" height="218" rx="28" fill="url(#panel)" stroke="#52687f" stroke-opacity=".55"/>
    <circle cx="58" cy="56" r="27" fill="#41617c"/><text x="58" y="67" class="num" text-anchor="middle">3</text>
    <text x="104" y="52" class="step">開始使用</text><text x="34" y="115" class="heading">進入 3A，再點「黑域 AI 助手」書籤</text>
    <rect x="34" y="143" width="856" height="48" rx="15" fill="#080b12" stroke="#30465a"/>
    <circle cx="63" cy="167" r="7" fill="#4be2a2" filter="url(#glow)"/><text x="88" y="175" class="body">畫面右側會出現可拖曳的黑域 AI 圓形圖示</text>
  </g>

  <g transform="translate(78 857)">
    <rect width="924" height="218" rx="28" fill="url(#panel)" stroke="#685bd0" stroke-opacity=".48"/>
    <circle cx="58" cy="56" r="27" fill="#6d5ddd"/><text x="58" y="67" class="num" text-anchor="middle">4</text>
    <text x="104" y="52" class="step">首次驗證</text><text x="34" y="115" class="heading">輸入已開通的 3A 帳號</text>
    <text x="34" y="160" class="body">系統核對會員權限與有效期限，通過後直接登入</text>
    <rect x="34" y="181" width="330" height="27" rx="14" fill="#38c99a" fill-opacity=".13"/><text x="49" y="201" class="chip">之後重新叫出不必再登入</text>
  </g>

  <g transform="translate(78 1111)">
    <rect width="444" height="278" rx="28" fill="url(#panel)" stroke="#3eabc2" stroke-opacity=".44"/>
    <circle cx="54" cy="52" r="27" fill="#278fa7"/><text x="54" y="63" class="num" text-anchor="middle">5</text>
    <text x="98" y="48" class="step">進入遊戲</text><text x="34" y="105" class="heading">遊戲頁再次叫出</text>
    <text x="34" y="150" class="body">頁面切換或重新整理後，</text><text x="34" y="185" class="body">再點一次助手書籤即可恢復。</text>
    <text x="34" y="226" class="mini">支援 3A 首頁及遊戲開啟後的網域</text>
    <text x="34" y="253" class="mini">會員登入狀態會保留</text>
  </g>
  <g transform="translate(558 1111)">
    <rect width="444" height="278" rx="28" fill="url(#panel)" stroke="#685bd0" stroke-opacity=".48"/>
    <circle cx="54" cy="52" r="27" fill="#6d5ddd"/><text x="54" y="63" class="num" text-anchor="middle">6</text>
    <text x="98" y="48" class="step">開始分析</text><text x="34" y="105" class="heading">選擇遊戲類型</text>
    <text x="34" y="150" class="body">百家樂・ATG・彩票・體育</text><text x="34" y="185" class="body">點選遊戲後直接進入分析流程</text>
    <rect x="34" y="215" width="376" height="42" rx="14" fill="url(#accent)" opacity=".88"/><text x="222" y="243" class="chip" text-anchor="middle">底部選單可快速切換功能</text>
  </g>

  <g transform="translate(78 1432)">
    <rect width="924" height="230" rx="30" fill="#1b1711" stroke="#d5a944" stroke-opacity=".48"/>
    <circle cx="62" cy="62" r="29" fill="#d0a13d" fill-opacity=".18" stroke="#d9ad4c"/><text x="62" y="71" class="noteTitle" text-anchor="middle">!</text>
    <text x="112" y="69" class="noteTitle">使用時請注意</text>
    <text x="38" y="121" class="noteBody">Safari 在整頁切換後會清除畫面上的懸浮元件，</text>
    <text x="38" y="158" class="noteBody">這時只需再點一次書籤，無須重新輸入 3A 帳號。</text>
    <text x="38" y="199" class="mini">建議將「黑域 AI 助手」放在 Safari 書籤最上方，操作最快。</text>
  </g>

  <rect x="78" y="1706" width="924" height="86" rx="24" fill="#0b1517" stroke="#3a9b91" stroke-opacity=".45"/>
  <text x="540" y="1742" class="step" text-anchor="middle">助手安裝頁</text>
  <text x="540" y="1774" class="body" text-anchor="middle">blackdomain-ai-v3-production.up.railway.app/assistant/</text>
  <text x="540" y="1850" class="mini" text-anchor="middle">分析資訊僅供娛樂參考，請理性使用。</text>
</svg>
