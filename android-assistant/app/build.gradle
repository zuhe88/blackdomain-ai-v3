plugins { id 'com.android.application' }

android {
    namespace 'ai.blackdomain.assistant'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.blackdomain.assistant'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('BLACKDOMAIN_KEYSTORE')) {
                storeFile file(System.getenv('BLACKDOMAIN_KEYSTORE'))
                storePassword System.getenv('BLACKDOMAIN_STORE_PASSWORD')
                keyAlias 'blackdomain'
                keyPassword System.getenv('BLACKDOMAIN_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
